<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="把 Markdown 快速转换成可直接粘贴到公众号的精致排版。" />
  <title>Jackson | Markdown 编辑器</title>
  <style>
    :root {
      --bg: #f5f5f7;
      --bg-2: #ececf1;
      --panel: rgba(255, 255, 255, 0.82);
      --panel-strong: rgba(255, 255, 255, 0.96);
      --panel-dark: rgba(255, 255, 255, 0.76);
      --line: rgba(60, 60, 67, 0.10);
      --line-strong: rgba(60, 60, 67, 0.16);
      --text: #1d1d1f;
      --muted: #6e6e73;
      --accent: #1d1d1f;
      --accent-2: #111111;
      --accent-soft: rgba(29, 29, 31, 0.08);
      --code-bg: #f5f5f7;
      --shadow: 0 18px 48px rgba(0, 0, 0, 0.06);
      --paper-shadow: 0 10px 28px rgba(0, 0, 0, 0.05);
      --radius-lg: 28px;
      --radius-md: 18px;
      --radius-sm: 14px;
      --editor-font: "Iosevka", "SFMono-Regular", "Cascadia Code", "Menlo", "Consolas", monospace;
      --preview-serif: "SF Pro Text", "SF Pro Display", "Inter", "Helvetica Neue", "Arial", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      --preview-sans: "SF Pro Text", "SF Pro Display", "Inter", "Helvetica Neue", "Arial", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      color: var(--text);
      background:
        radial-gradient(circle at 10% 8%, rgba(29, 29, 31, 0.04), transparent 24%),
        radial-gradient(circle at 90% 10%, rgba(60, 60, 67, 0.04), transparent 22%),
        linear-gradient(180deg, #fafafa 0%, #f5f5f7 46%, #f0f0f3 100%);
      font-family: var(--preview-serif);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(60, 60, 67, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(60, 60, 67, 0.025) 1px, transparent 1px);
      background-size: 64px 64px;
      opacity: 0.55;
      mask-image: linear-gradient(180deg, rgba(0,0,0,0.35), transparent 96%);
    }

    .page {
      position: relative;
      width: min(1440px, calc(100vw - 28px));
      margin: 0 auto;
      padding: 18px 0 28px;
    }

    .shell {
      position: relative;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 18px;
      min-height: calc(100vh - 46px);
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 18px 20px;
      border: 1px solid rgba(60, 60, 67, 0.08);
      border-radius: var(--radius-lg);
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(18px);
      box-shadow: var(--shadow);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .mark {
      width: 50px;
      height: 50px;
      border-radius: 16px;
      display: grid;
      place-items: center;
      color: #fff;
      background:
        linear-gradient(145deg, #1d1d1f, #3a3a3c);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.15), 0 8px 18px rgba(0, 0, 0, 0.10);
      overflow: hidden;
      font: 700 20px/1 var(--preview-sans);
    }

    .mark img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .brand h1 {
      margin: 0;
      font-size: 18px;
      letter-spacing: 0.04em;
      font-weight: 700;
    }

    .brand p {
      margin: 4px 0 0;
      color: var(--muted);
      font: 500 12px/1.5 var(--preview-sans);
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 10px;
    }

    .editor-actions {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .doc-stats {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 0;
      color: var(--muted);
      font: 500 12px/1 var(--preview-sans);
      letter-spacing: 0.01em;
      white-space: nowrap;
    }

    .doc-stats::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 999px;
      background: rgba(60, 60, 67, 0.42);
    }

    .btn {
      border: 1px solid rgba(60, 60, 67, 0.10);
      background: rgba(255,255,255,0.82);
      color: var(--text);
      border-radius: 999px;
      padding: 10px 15px;
      font: 600 13px/1 var(--preview-sans);
      cursor: pointer;
      transition: transform 160ms ease, border-color 160ms ease, background 160ms ease, box-shadow 160ms ease;
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.04);
    }

    .btn:hover {
      transform: translateY(-1px);
      border-color: rgba(29, 29, 31, 0.18);
      box-shadow: 0 10px 22px rgba(0, 0, 0, 0.06);
    }

    .btn.primary {
      background: linear-gradient(145deg, #2c2c2e, #111111);
      color: #fff;
      border-color: transparent;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(360px, 0.92fr) minmax(420px, 1.08fr);
      gap: 18px;
      min-height: 0;
    }

    .panel {
      position: relative;
      min-height: 0;
      border: 1px solid rgba(60, 60, 67, 0.08);
      border-radius: var(--radius-lg);
      background: var(--panel);
      backdrop-filter: blur(20px);
      box-shadow: var(--paper-shadow);
      overflow: hidden;
    }

    .panel-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 18px 18px 14px;
      border-bottom: 1px solid rgba(60, 60, 67, 0.08);
      background: rgba(255,255,255,0.72);
      min-height: 86px;
    }

    .preview-head {
      min-height: 86px;
    }

    .panel-head h2 {
      margin: 0;
      font-size: 14px;
      letter-spacing: 0.14em;
      font-family: var(--preview-sans);
      text-transform: uppercase;
    }

    .panel-head .hint {
      margin: 0;
      color: var(--muted);
      font: 500 12px/1.45 var(--preview-sans);
    }

    .mode-switch {
      display: inline-flex;
      gap: 6px;
      padding: 5px;
      border-radius: 999px;
      border: 1px solid rgba(60, 60, 67, 0.10);
      background: rgba(255,255,255,0.82);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.55);
    }

    .mode-switch button {
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: var(--muted);
      padding: 9px 13px;
      font: 600 12px/1 var(--preview-sans);
      cursor: pointer;
      transition: background 160ms ease, color 160ms ease, box-shadow 160ms ease;
    }

    .mode-switch button[aria-pressed="true"] {
      background: linear-gradient(145deg, #2c2c2e, #111111);
      color: #fff;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.14);
    }

    .inline-btn {
      border: 1px solid rgba(60, 60, 67, 0.10);
      background: rgba(255,255,255,0.86);
      color: var(--text);
      border-radius: 999px;
      padding: 8px 12px;
      font: 600 12px/1 var(--preview-sans);
      cursor: pointer;
      transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.04);
      white-space: nowrap;
    }

    .inline-btn:hover {
      transform: translateY(-1px);
      border-color: rgba(29, 29, 31, 0.18);
      box-shadow: 0 10px 22px rgba(0, 0, 0, 0.06);
    }

    .editor-wrap {
      position: relative;
      height: calc(100vh - 182px);
      min-height: 620px;
    }

    textarea {
      width: 100%;
      height: 100%;
      border: 0;
      outline: 0;
      resize: none;
      padding: 20px 22px 24px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.78), rgba(255,255,255,0.54)),
        rgba(255,255,255,0.22);
      color: #1d1d1f;
      font: 500 15px/1.8 var(--editor-font);
      letter-spacing: 0.01em;
      tab-size: 2;
      caret-color: var(--accent);
      overflow: auto;
    }

    textarea::selection {
      background: rgba(122, 78, 43, 0.18);
    }

    .preview {
      display: flex;
      align-items: stretch;
      height: calc(100vh - 182px);
      min-height: 620px;
      overflow: auto;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.54), rgba(248,248,250,0.96));
    }

    .preview-stage {
      width: 100%;
      min-height: 100%;
      padding: 30px 18px 34px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .paper {
      width: min(100%, 880px);
      margin: 0 auto;
      padding: 36px 38px 46px;
      color: #1d1d1f;
      font-family: var(--preview-serif);
      font-size: 14px;
      line-height: 2.0;
      letter-spacing: 0;
    }

    .preview[data-mode="mobile"] {
      background:
        linear-gradient(180deg, rgba(248,248,250,0.96), rgba(241,241,244,0.96));
    }

    .preview[data-mode="mobile"] .preview-stage {
      padding: 22px 16px 26px;
    }

    .preview[data-mode="mobile"] .paper {
      width: min(390px, 100%);
      padding: 24px 20px 30px;
      border-radius: 28px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.05);
      font-size: 14px;
      line-height: 2.0;
      background: rgba(255,255,255,0.92);
    }

    .preview[data-mode="wechat"] {
      background:
        linear-gradient(180deg, rgba(248,248,250,0.96), rgba(242,242,245,0.96));
    }

    .preview[data-mode="wechat"] .preview-stage {
      padding: 22px 16px 26px;
    }

    .preview[data-mode="wechat"] .paper {
      width: min(375px, 100%);
      padding: 24px 20px 30px;
      border-radius: 24px;
      border: 1px solid rgba(60, 60, 67, 0.08);
      box-shadow: none;
      background: #ffffff;
      font-size: 14px;
      line-height: 2.0;
    }

    .paper > :first-child { margin-top: 0; }
    .paper > :last-child { margin-bottom: 0; }

    .paper h1,
    .paper h2,
    .paper h3,
    .paper h4 {
      margin: 1.2em 0 0.45em;
      line-height: 1.22;
      letter-spacing: 0.01em;
      font-family: var(--preview-serif);
      color: #1d1d1f;
    }

    .paper h1 {
      font-size: clamp(18px, 1.6vw, 22px);
      margin-top: 0;
      padding-bottom: 0.28em;
      border-bottom: 1px solid rgba(60, 60, 67, 0.10);
    }

    .paper h2 {
      font-size: clamp(15px, 1.3vw, 17px);
      position: relative;
      padding-left: 0;
      padding-bottom: 0.35em;
      border-bottom: 1px solid rgba(60, 60, 67, 0.10);
    }

    .paper h2::before {
      content: none;
    }

    .paper h3 { font-size: clamp(14px, 1.1vw, 16px); }
    .paper h4 { font-size: 12px; font-family: var(--preview-sans); letter-spacing: 0.03em; }

    .paper p {
      margin: 0 0 1em;
      color: #5e5e63;
      font-size: 1em;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .paper a {
      color: #111111;
      text-decoration-thickness: 1px;
      text-underline-offset: 0.16em;
    }

    .paper strong {
      color: #1d1d1f;
      font-weight: 700;
    }

    .paper em {
      color: #5a5a5f;
    }

    .paper code {
      padding: 0.14em 0.36em;
      border-radius: 8px;
      background: var(--code-bg);
      border: 1px solid rgba(60, 60, 67, 0.08);
      font-family: var(--editor-font);
      font-size: 0.9em;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .paper pre {
      margin: 1.15em 0;
      padding: 18px 20px;
      overflow: auto;
      border-radius: 18px;
      background: #f5f5f7;
      color: #1d1d1f;
      border: 1px solid rgba(60, 60, 67, 0.08);
      box-shadow: none;
      font-size: 0.9em;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .paper pre code {
      padding: 0;
      border: 0;
      background: transparent;
      color: inherit;
      font-size: 0.92em;
      line-height: 1.72;
    }

    .paper blockquote {
      margin: 1.2em 0;
      padding: 14px 18px;
      border-left: 4px solid rgba(29, 29, 31, 0.32);
      border-radius: 0 16px 16px 0;
      background: rgba(29, 29, 31, 0.04);
      color: #4a4a4d;
    }

    .paper ul,
    .paper ol {
      padding-left: 1.35em;
      margin: 0 0 1em;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .paper li {
      margin: 0.34em 0;
    }

    .paper hr {
      margin: 1.4em 0;
      border: 0;
      border-top: 1px solid rgba(60, 60, 67, 0.10);
    }

    .paper table {
      width: 100%;
      border-collapse: collapse;
      margin: 1.15em 0;
      font-size: 0.96em;
      overflow: hidden;
      border-radius: 16px;
      table-layout: fixed;
    }

    .paper th,
    .paper td {
      padding: 11px 13px;
      border: 1px solid rgba(60, 60, 67, 0.08);
      text-align: left;
      vertical-align: top;
    }

    .paper th {
      background: rgba(60, 60, 67, 0.04);
      font-family: var(--preview-sans);
      font-size: 0.88em;
      letter-spacing: 0.04em;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .paper td {
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .paper img {
      max-width: 100%;
      border-radius: 18px;
      display: block;
      margin: 1.1em auto;
      box-shadow: 0 14px 24px rgba(34, 20, 10, 0.12);
    }

    .paper .lead {
      font-size: 1em;
      color: #2f2f33;
    }

    .preview-empty,
    .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 12px;
      border-radius: 999px;
      border: 1px solid rgba(60, 60, 67, 0.10);
      background: rgba(255,255,255,0.84);
      color: #4b4b51;
      font: 600 12px/1 var(--preview-sans);
      letter-spacing: 0.03em;
    }

    .badge::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: linear-gradient(180deg, #3a3a3c, #1d1d1f);
      box-shadow: 0 0 0 3px rgba(29, 29, 31, 0.08);
    }

    .empty {
      display: grid;
      place-items: center;
      height: 100%;
      padding: 30px;
      text-align: center;
      color: var(--muted);
      font: 500 15px/1.8 var(--preview-sans);
    }

    .empty strong {
      display: block;
      margin-bottom: 10px;
      color: var(--text);
      font-size: 18px;
      letter-spacing: 0.04em;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      align-items: center;
      padding: 0 4px;
      color: rgba(60, 60, 67, 0.64);
      font: 500 12px/1.7 var(--preview-sans);
    }

    .footer .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }

    .footer .stats span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 11px;
      border: 1px solid rgba(60, 60, 67, 0.08);
      border-radius: 999px;
      background: rgba(255,255,255,0.78);
    }

    .footer .stats b {
      color: #1d1d1f;
    }

    .footer a {
      color: #6e6e73;
      text-decoration: none;
      font-weight: 500;
      transition: color 160ms ease, opacity 160ms ease;
    }

    .footer a:hover {
      color: #1d1d1f;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 1100px) {
      .workspace {
        grid-template-columns: 1fr;
      }

      .editor-wrap,
      .preview {
        height: auto;
        min-height: 520px;
      }

      .panel {
        min-height: 0;
      }
    }

    @media (max-width: 720px) {
      .page {
        width: min(100vw - 14px, 1440px);
        padding-top: 8px;
      }

      .topbar {
        flex-direction: column;
        align-items: flex-start;
      }

      .toolbar {
        width: 100%;
        justify-content: flex-start;
      }

      .panel-head {
        flex-direction: column;
        align-items: flex-start;
      }

      .paper {
        padding: 28px 22px 40px;
        font-size: 17px;
      }

      textarea {
        padding: 18px;
        font-size: 14px;
      }
    }

    /* Interaction-first workspace */
    :root {
      --canvas: #f3f1ec;
      --surface: #ffffff;
      --surface-subtle: #f8f7f4;
      --ink: #191918;
      --ink-soft: #6f6d66;
      --hairline: #e7e4dd;
      --wechat: #07883f;
      --wechat-hover: #066f35;
      --focus: rgba(7, 136, 63, 0.18);
    }

    html,
    body {
      background: var(--canvas);
    }

    body::before {
      display: none;
    }

    button,
    textarea {
      font-family: inherit;
    }

    button:focus-visible,
    textarea:focus-visible,
    a:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }

    .app-shell {
      width: min(1520px, 100%);
      min-height: 100vh;
      margin: 0 auto;
      padding: 0 28px 22px;
    }

    .app-header {
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      border-bottom: 1px solid rgba(25, 25, 24, 0.10);
    }

    .app-brand {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 0;
    }

    .app-brand .mark {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      box-shadow: none;
    }

    .brand-copy strong {
      display: block;
      color: var(--ink);
      font-size: 14px;
      line-height: 1.2;
      letter-spacing: -0.01em;
    }

    .brand-copy span {
      display: block;
      margin-top: 3px;
      color: var(--ink-soft);
      font-size: 11px;
      line-height: 1.2;
    }

    .privacy-note {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--ink-soft);
      font-size: 12px;
      white-space: nowrap;
    }

    .privacy-note::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--wechat);
      box-shadow: 0 0 0 4px rgba(7, 136, 63, 0.10);
    }

    .workflow {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      max-width: 620px;
      margin: 22px auto 18px;
      color: var(--ink-soft);
      font-size: 12px;
    }

    .workflow-step {
      position: relative;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .workflow-step:nth-child(2) {
      justify-content: center;
    }

    .workflow-step:nth-child(3) {
      justify-content: flex-end;
    }

    .workflow-step:not(:last-child)::after {
      content: "";
      position: absolute;
      top: 50%;
      left: calc(50% + 34px);
      width: calc(100% - 68px);
      height: 1px;
      background: #d7d3ca;
    }

    .step-number {
      width: 22px;
      height: 22px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border: 1px solid #d7d3ca;
      border-radius: 50%;
      background: var(--canvas);
      color: var(--ink-soft);
      font-size: 11px;
      font-weight: 700;
      z-index: 1;
    }

    .workflow-step.is-active {
      color: var(--ink);
      font-weight: 650;
    }

    .workflow-step.is-active .step-number {
      border-color: var(--ink);
      background: var(--ink);
      color: white;
    }

    .workflow-step.is-complete .step-number {
      border-color: rgba(7, 136, 63, 0.28);
      background: rgba(7, 136, 63, 0.10);
      color: var(--wechat);
    }

    .mobile-workspace-switch {
      display: none;
    }

    .workspace-v2 {
      display: grid;
      grid-template-columns: minmax(360px, 0.84fr) minmax(520px, 1.16fr);
      min-height: calc(100vh - 174px);
      overflow: hidden;
      border: 1px solid rgba(25, 25, 24, 0.10);
      border-radius: 22px;
      background: var(--surface);
      box-shadow: 0 16px 44px rgba(42, 38, 30, 0.07);
    }

    .work-panel {
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background: var(--surface);
    }

    .source-panel {
      border-right: 1px solid var(--hairline);
    }

    .panel-toolbar-v2 {
      min-height: 86px;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      border-bottom: 1px solid var(--hairline);
      background: rgba(255, 255, 255, 0.96);

# 一页很舒服的 Markdown

## 为什么它要长得像一本书

好的编辑器，不只是把 Markdown 渲染出来，而是让内容本身更容易被阅读。
所以这里我把右侧预览做成了偏“纸张感”的版式：更宽的行距、更克制的颜色、清晰的标题层级，
让普通文档也能有很好的气质。

> 视觉不是装饰，而是帮助理解内容的结构。

## 适合写什么

- 文章草稿
- 产品说明
- 周报 / 月报
- 读书笔记
- 演示文稿初稿

## 代码示例

```js
function formatMarkdown(text) {
  return text.trim().replace(/\n{3,}/g, "\n\n");
}
```

## 表格示例

| 功能 | 说明 |
| --- | --- |
| 标题 | 自动建立层级感 |
| 引用 | 更像出版物里的注释 |
| 代码 | 使用深色代码块突出语义 |

## 收尾

如果你把一段原始文档贴进来，它会尽量保持内容本身，同时帮你把排版、字体和留白做得更稳重。

    function renderInline(text) {
      let html = escapeHtml(text);
      html = html.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, (_, alt, src) => `<img alt="${escapeHtml(alt)}" src="${escapeHtml(src)}" />`);
      html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noreferrer noopener">$1</a>');
      html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
      html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      html = html.replace(/\*([^*]+)\*/g, '<em>$1</em>');
      html = html.replace(/~~([^~]+)~~/g, '<del>$1</del>');
      return html;

    function parseTable(lines, start) {
      if (!lines[start] || !lines[start + 1]) return null;
      const headerLine = lines[start].trim();
      const dividerLine = lines[start + 1].trim();
      if (!headerLine.includes('|') || !/^[:\-\s|]+$/.test(dividerLine)) return null;

      const splitRow = (line) => line.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(cell => cell.trim());
      const headers = splitRow(headerLine);
      const rows = [];
      let index = start + 2;
      while (index < lines.length && lines[index].includes('|') && lines[index].trim() !== '') {
        rows.push(splitRow(lines[index]));
        index += 1;
      }

      const alignments = splitRow(dividerLine).map((cell) => {
        const left = cell.startsWith(':');
        const right = cell.endsWith(':');
        if (left && right) return 'center';
        if (right) return 'right';
        return 'left';
      });

      const thead = `<thead><tr>${headers.map((cell, index) => `<th style="text-align:${alignments[index] || 'left'}">${renderInline(cell)}</th>`).join('')}</tr></thead>`;
      const tbody = `<tbody>${rows.map((row) => `<tr>${headers.map((_, i) => `<td style="text-align:${alignments[i] || 'left'}">${renderInline(row[i] || '')}</td>`).join('')}</tr>`).join('')}</tbody>`;
      return { html: `<table>${thead}${tbody}</table>`, nextIndex: index - 1 };
    }

    function renderMarkdown(source) {
      const lines = source.replace(/\r\n/g, '\n').split('\n');
      let html = '';
      let i = 0;
      let inCode = false;
      let codeLang = '';
      let codeBuffer = [];
      let paragraphBuffer = [];
      let listType = null;
      let listBuffer = [];
      let stats = { headings: 0, paragraphs: 0, codes: 0 };

      const flushParagraph = () => {
        if (!paragraphBuffer.length) return;
        const text = paragraphBuffer.join(' ').trim();
        if (text) {
          const isLead = html === '';
          html += `<p${isLead ? ' class="lead"' : ''}>${renderInline(text)}</p>`;
          stats.paragraphs += 1;
        }
        paragraphBuffer = [];
      };

      const flushList = () => {
        if (!listBuffer.length) return;
        html += `<${listType}>${listBuffer.map(item => `<li>${renderInline(item)}</li>`).join('')}</${listType}>`;
        listBuffer = [];
        listType = null;
      };

      const flushCode = () => {
        if (!codeBuffer.length) return;
        html += `<pre><code${codeLang ? ` class="language-${escapeHtml(codeLang)}"` : ''}>${escapeHtml(codeBuffer.join('\n'))}</code></pre>`;
        stats.codes += 1;
        codeBuffer = [];
        codeLang = '';
      };

      while (i < lines.length) {
        const line = lines[i];
        const trimmed = line.trim();

        if (trimmed.startsWith('```')) {
          if (!inCode) {
            flushParagraph();
            flushList();
            inCode = true;
            codeLang = trimmed.slice(3).trim();
          } else {
            inCode = false;
            flushCode();
          }
          i += 1;
          continue;
        }

        if (inCode) {
          codeBuffer.push(line);
          i += 1;
          continue;
        }

        if (!trimmed) {
          flushParagraph();
          flushList();
          i += 1;
          continue;
        }

        const table = parseTable(lines, i);
        if (table) {
          flushParagraph();
          flushList();
          html += table.html;
          i = table.nextIndex + 1;
          continue;
        }

        const headingMatch = /^(#{1,6})\s+(.*)$/.exec(trimmed);
        if (headingMatch) {
          flushParagraph();
          flushList();
          const level = headingMatch[1].length;
          const id = slugify(headingMatch[2]);
          html += `<h${level} id="${id}">${renderInline(headingMatch[2])}</h${level}>`;
          stats.headings += 1;
          i += 1;
          continue;
        }

        if (/^>\s?/.test(trimmed)) {
          flushParagraph();
          flushList();
          const quoteLines = [];
          while (i < lines.length && /^>\s?/.test(lines[i].trim())) {
            quoteLines.push(lines[i].trim().replace(/^>\s?/, ''));
            i += 1;
          }
          html += `<blockquote>${quoteLines.map((part) => renderInline(part)).join('<br>')}</blockquote>`;
          continue;
        }

        if (/^(-{3,}|\*{3,}|_{3,})$/.test(trimmed)) {
          flushParagraph();
          flushList();
          html += '<hr />';
          i += 1;
          continue;
        }

        const orderedMatch = /^(\d+)\.\s+(.*)$/.exec(trimmed);
        const unorderedMatch = /^[-*+]\s+(.*)$/.exec(trimmed);
        if (orderedMatch || unorderedMatch) {
          flushParagraph();
          const nextType = orderedMatch ? 'ol' : 'ul';
          if (listType && listType !== nextType) flushList();
          listType = nextType;
          listBuffer.push((orderedMatch || unorderedMatch)[2] || (unorderedMatch && unorderedMatch[1]) || '');
          i += 1;
          while (i < lines.length) {
            const nextTrimmed = lines[i].trim();
            const nextOrdered = /^(\d+)\.\s+(.*)$/.exec(nextTrimmed);
            const nextUnordered = /^[-*+]\s+(.*)$/.exec(nextTrimmed);
            if ((nextType === 'ol' && nextOrdered) || (nextType === 'ul' && nextUnordered)) {
              listBuffer.push((nextOrdered || nextUnordered)[2] || (nextOrdered || nextUnordered)[1] || '');
              i += 1;
            } else {
              break;
            }
          }
          continue;
        }

        paragraphBuffer.push(trimmed);
        i += 1;
      }

      flushParagraph();
      flushList();
      if (inCode) flushCode();

      if (!html.trim()) {
        html = `
          <div class="empty">
            <div>
              <div class="empty-illustration" aria-hidden="true"></div>
              <strong>排版会在这里出现</strong>
              <p>先在左侧粘贴 Markdown，内容会立即转换，不会离开当前页面。</p>
              <button class="secondary-btn" type="button" data-use-sample>看看示例效果</button>
            </div>
          </div>
        `;
      }

      return { html, stats };
    }

    function updatePreview() {
      const value = input.value.trim();
      const { html, stats } = renderMarkdown(value);
      preview.innerHTML = html;
      previewPanel.dataset.mode = currentPreviewMode;

      const chars = value.replace(/\s/g, '').length;
      const lines = value ? value.split('\n').length : 0;
      docStats.textContent = `${chars} 字 · ${lines} 行`;
      headingCount.textContent = `${stats.headings}`;
      paragraphCount.textContent = `${stats.paragraphs}`;
      codeCount.textContent = `${stats.codes}`;

      const hasContent = Boolean(value);
      btnCopy.disabled = !hasContent;
      btnExport.disabled = !hasContent;
      btnExportImage.disabled = !hasContent || isExportingImage;
      btnCopyWeChat.disabled = !hasContent;
      btnClear.disabled = !hasContent;
      outputStatusTitle.textContent = hasContent ? '公众号排版已就绪' : '等待贴入内容';
      outputStatusHint.textContent = hasContent ? '复制后直接粘贴到微信编辑器' : '内容会在本页即时转换';
      setWorkflowStage(hasContent ? 2 : 1);

      const emptySampleButton = preview.querySelector('[data-use-sample]');
      if (emptySampleButton) emptySampleButton.addEventListener('click', useSample);
    }

    async function copyRichHtmlToClipboard(html, plainText) {
      if (navigator.clipboard && window.ClipboardItem) {
        try {
          const item = new ClipboardItem({
            'text/html': new Blob([html], { type: 'text/html' }),
            'text/plain': new Blob([plainText], { type: 'text/plain' })
          });
          await navigator.clipboard.write([item]);
          return true;
        } catch (error) {
          // Fall through to the legacy copy path.
        }
      }

      const helper = document.createElement('div');
      helper.contentEditable = 'true';
      helper.style.cssText = 'position:fixed;left:-9999px;top:0;width:1px;height:1px;overflow:hidden;opacity:0;';
      helper.innerHTML = html;
      document.body.appendChild(helper);

      const selection = window.getSelection();
      const range = document.createRange();
      range.selectNodeContents(helper);
      selection.removeAllRanges();
      selection.addRange(range);

      let copied = false;
      try {
        copied = document.execCommand('copy');
      } catch (error) {
        copied = false;
      }

      selection.removeAllRanges();
      helper.remove();
      return copied;
    }

    function copyMarkdown() {
      const text = input.value;
      if (!text.trim()) return;
      const done = () => showToast('Markdown 已复制');

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done).catch(() => {
          input.focus();
          input.select();
          document.execCommand('copy');
          done();
        });
        return;
      }

      input.focus();
      input.select();
      document.execCommand('copy');
      done();
    }

    function importMarkdownFile(file) {
      if (!file) return;

      reader.onload = () => {
        input.value = String(reader.result || '');

        showToast(`已导入 ${file.name}`);

      reader.readAsText(file);

    function insertImageAtCursor(markdownImageSyntax) {
      const start = input.selectionStart ?? input.value.length;
      const end = input.selectionEnd ?? input.value.length;
      const value = input.value;
      const before = value.slice(0, start);
      const after = value.slice(end);
      const needsSpaceBefore = before && !/\n$/.test(before) && !/\s$/.test(before);
      const needsSpaceAfter = after && !/^\n/.test(after) && !/^\s/.test(after);
      const snippet = `${needsSpaceBefore ? '\n' : ''}${markdownImageSyntax}${needsSpaceAfter ? '\n' : ''}`;
      input.value = `${before}${snippet}${after}`;
      const caret = before.length + snippet.length;
      input.setSelectionRange(caret, caret);
      input.focus();
      updatePreview();
    }

    function readBlobAsDataUrl(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result || ''));
        reader.onerror = () => reject(reader.error || new Error('图片读取失败'));
        reader.readAsDataURL(blob);
      });
    }

    async function imageAsDataUrl(image) {
      const source = image.currentSrc || image.src;
      if (!source) throw new Error('图片地址为空');
      if (source.startsWith('data:')) return source;

      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 5000);
      try {
        const response = await fetch(source, {
          mode: 'cors',
          credentials: 'omit',
          signal: controller.signal
        });
        if (!response.ok) throw new Error(`图片加载失败：${response.status}`);
        return await readBlobAsDataUrl(await response.blob());
      } catch (error) {
        if (image.complete && image.naturalWidth && image.naturalHeight) {
          const canvas = document.createElement('canvas');
          canvas.width = image.naturalWidth;
          canvas.height = image.naturalHeight;
          const context = canvas.getContext('2d');
          context.drawImage(image, 0, 0);
          return canvas.toDataURL('image/png');
        }
        throw error;
      } finally {
        clearTimeout(timeout);
      }
    }

    function inlineComputedTree(sourceElement, clonedElement) {
      const computed = getComputedStyle(sourceElement);
      for (let index = 0; index < computed.length; index += 1) {
        const property = computed[index];
        clonedElement.style.setProperty(
          property,
          computed.getPropertyValue(property),
          computed.getPropertyPriority(property)
        );
      }

      const sourceChildren = [...sourceElement.children];
      const clonedChildren = [...clonedElement.children];
      sourceChildren.forEach((child, index) => {
        if (clonedChildren[index]) inlineComputedTree(child, clonedChildren[index]);
      });
    }

    async function inlinePreviewImages(sourceRoot, clonedRoot) {
      const sourceImages = [...sourceRoot.querySelectorAll('img')];
      const clonedImages = [...clonedRoot.querySelectorAll('img')];
      let omittedImages = 0;

      await Promise.all(sourceImages.map(async (sourceImage, index) => {
        const clonedImage = clonedImages[index];
        if (!clonedImage) return;
        try {
          clonedImage.src = await imageAsDataUrl(sourceImage);
          clonedImage.removeAttribute('srcset');
          if (clonedImage.decode) await clonedImage.decode().catch(() => {});
        } catch (error) {
          omittedImages += 1;
          const placeholder = document.createElement('div');
          placeholder.textContent = sourceImage.alt ? `图片：${sourceImage.alt}` : '图片未能载入';
          placeholder.style.cssText = `${clonedImage.style.cssText};display:flex;align-items:center;justify-content:center;min-height:120px;background:#f3f2ef;color:#8a877f;font-size:13px;box-shadow:none;`;
          clonedImage.replaceWith(placeholder);
        }
      }));

      return omittedImages;
    }

    function loadImage(url) {
      return new Promise((resolve, reject) => {
        const image = new Image();
        const timeout = setTimeout(() => reject(new Error('图片生成超时')), 12000);
        image.onload = () => {
          clearTimeout(timeout);
          resolve(image);
        };
        image.onerror = () => {
          clearTimeout(timeout);
          reject(new Error('浏览器无法渲染图片'));
        };
        image.src = url;
      });
    }

    function canvasToPng(canvas) {
      return new Promise((resolve, reject) => {
        canvas.toBlob((blob) => {
          if (blob) resolve(blob);
          else reject(new Error('PNG 编码失败'));
        }, 'image/png');
      });
    }

    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1500);
    }

    async function exportImage() {
      if (!input.value.trim() || isExportingImage) return;
      isExportingImage = true;
      btnExportImage.disabled = true;
      btnExportImage.classList.add('is-loading');
      btnExportImage.textContent = '生成中…';

      const exportMode = currentPreviewMode;
      const modeWidths = { desktop: 824, mobile: 422, wechat: 407 };
      const exportPadding = exportMode === 'desktop' ? 32 : 24;
      const renderStage = document.createElement('div');
      renderStage.className = 'preview preview-v2';
      renderStage.dataset.mode = exportMode;
      renderStage.setAttribute('aria-hidden', 'true');
      renderStage.style.cssText = `position:fixed;left:-100000px;top:0;width:${modeWidths[exportMode]}px;height:auto;min-height:0;overflow:visible;display:block;pointer-events:none;`;
      renderStage.innerHTML = '<div class="preview-stage"><article class="paper"></article></div>';
      const renderedPaper = renderStage.querySelector('.paper');
      renderedPaper.innerHTML = preview.innerHTML;
      document.body.appendChild(renderStage);

      let svgUrl = '';
      try {
        if (document.fonts && document.fonts.ready) {
          await Promise.race([
            document.fonts.ready,
            new Promise((resolve) => setTimeout(resolve, 2000))
          ]);
        }
        await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));

        const omittedImages = await inlinePreviewImages(renderedPaper, renderedPaper);
        await new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
        const paperWidth = Math.ceil(renderedPaper.getBoundingClientRect().width);
        const paperHeight = Math.max(
          Math.ceil(renderedPaper.getBoundingClientRect().height),
          Math.ceil(renderedPaper.scrollHeight)
        );
        const clonedPaper = renderedPaper.cloneNode(true);
        inlineComputedTree(renderedPaper, clonedPaper);
        clonedPaper.removeAttribute('id');
        clonedPaper.removeAttribute('aria-live');
        clonedPaper.style.width = `${paperWidth}px`;
        clonedPaper.style.height = 'auto';
        clonedPaper.style.minHeight = '0';
        clonedPaper.style.margin = '0';

        const exportWidth = paperWidth + exportPadding * 2;
        const exportHeight = paperHeight + exportPadding * 2;
        const maxCanvasDimension = 16384;
        const maxCanvasPixels = 64000000;
        const scale = Math.min(
          2,
          maxCanvasDimension / exportWidth,
          maxCanvasDimension / exportHeight,
          Math.sqrt(maxCanvasPixels / (exportWidth * exportHeight))
        );
        if (scale < 0.5) throw new Error('内容过长，建议分成两篇后分别导出');

        const wrapper = document.createElement('div');
        wrapper.setAttribute('xmlns', 'http://www.w3.org/1999/xhtml');
        wrapper.style.cssText = `box-sizing:border-box;width:${exportWidth}px;height:${exportHeight}px;padding:${exportPadding}px;background:#eeece7;overflow:hidden;`;
        wrapper.appendChild(clonedPaper);

        const serialized = new XMLSerializer().serializeToString(wrapper);
        const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${exportWidth}" height="${exportHeight}" viewBox="0 0 ${exportWidth} ${exportHeight}"><foreignObject width="100%" height="100%">${serialized}</foreignObject></svg>`;
        svgUrl = await readBlobAsDataUrl(new Blob([svg], { type: 'image/svg+xml;charset=utf-8' }));
        const rasterImage = await loadImage(svgUrl);

        const canvas = document.createElement('canvas');
        canvas.width = Math.round(exportWidth * scale);
        canvas.height = Math.round(exportHeight * scale);
        const context = canvas.getContext('2d');
        if (!context) throw new Error('浏览器不支持图片画布');
        context.fillStyle = '#eeece7';
        context.fillRect(0, 0, canvas.width, canvas.height);
        context.drawImage(rasterImage, 0, 0, canvas.width, canvas.height);

        const png = await canvasToPng(canvas);
        const date = new Date().toLocaleDateString('sv-SE');
        downloadBlob(png, `markdown-${exportMode}-${date}.png`);
        setWorkflowStage(3);
        showToast(omittedImages ? `图片已导出，${omittedImages} 张网络图片未能载入` : 'PNG 长图已导出');
      } catch (error) {
        console.error(error);
        showToast(error && error.message ? error.message : '图片导出失败，请稍后重试');
      } finally {
        if (svgUrl.startsWith('blob:')) URL.revokeObjectURL(svgUrl);
        renderStage.remove();
        isExportingImage = false;
        btnExportImage.classList.remove('is-loading');
        btnExportImage.textContent = '导出图片';
        btnExportImage.disabled = !input.value.trim();
      }
    }

    btnImport.addEventListener('click', openMdPicker);
    btnSample.addEventListener('click', useSample);
    btnImage.addEventListener('click', openImagePicker);

    btnClear.addEventListener('click', () => {
      const clearedValue = input.value;
      if (!clearedValue) return;
      input.value = '';
      updatePreview();
      input.focus();
      showToast('内容已清空', '撤销', () => {
        input.value = clearedValue;
        updatePreview();
        input.focus();
      });
    });

    btnCopy.addEventListener('click', copyMarkdown);
    btnCopyWeChat.addEventListener('click', copyToWeChat);
    btnExport.addEventListener('click', exportHtml);
    btnExportImage.addEventListener('click', exportImage);
    input.addEventListener('input', updatePreview);
    input.addEventListener('paste', () => {
      requestAnimationFrame(() => {
        updatePreview();
        showToast('内容已贴入，右侧排版已更新');
      });
    });
    input.addEventListener('keydown', (event) => {
      if ((event.metaKey || event.ctrlKey) && event.key === 'Enter') {
        event.preventDefault();
        copyToWeChat();
      }
    });
    modeDesktop.addEventListener('click', () => {
      setPreviewMode('desktop');
      updatePreview();
    });
    modeMobile.addEventListener('click', () => {
      setPreviewMode('mobile');
      updatePreview();
    });
    modeWeChat.addEventListener('click', () => {
      setPreviewMode('wechat');
      updatePreview();
    });
    mobileEdit.addEventListener('click', () => setWorkspaceView('edit'));
    mobilePreview.addEventListener('click', () => setWorkspaceView('preview'));

    setPreviewMode('desktop');
    setWorkspaceView('edit');
    input.value = '';
    updatePreview();
  </script>
</body>
</html>
